name: Publish language adapters

# Publishes adapters to GitHub Packages and attaches binaries to a GitHub Release.
# Uses GITHUB_TOKEN only (no npmjs / Maven Central / nuget.org secrets).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package / release version"
        required: true
        default: "4.0.0"
      dry_run:
        description: "Build only (no publish / no release)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  junit5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package
        working-directory: adapters/junit5
        run: |
          sed -i 's#<version>4.0.0</version>#<version>${{ inputs.version }}</version>#' pom.xml
          mvn -B -DskipTests clean package
      - name: Deploy to GitHub Packages
        if: ${{ inputs.dry_run == false }}
        working-directory: adapters/junit5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>USERNAME</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          sed -i 's/USERNAME/${{ github.actor }}/' ~/.m2/settings.xml
          set +e
          mvn -B -DskipTests deploy \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::Maven deploy exited $status (version may already exist on GitHub Packages); continuing"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: junit5-maven
          path: |
            adapters/junit5/target/mcp-test-suite-junit5-*.jar
            !adapters/junit5/target/*-sources.jar
            !adapters/junit5/target/*-javadoc.jar
            adapters/junit5/pom.xml
          if-no-files-found: error

  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@vaquarkhan"
      - name: Build
        working-directory: adapters/jest
        run: |
          npm install
          npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
          npm run build
          npm pack
      - name: Publish to GitHub Packages
        if: ${{ inputs.dry_run == false }}
        working-directory: adapters/jest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
      - uses: actions/upload-artifact@v4
        with:
          name: jest-npm
          path: adapters/jest/*.tgz
          if-no-files-found: error

  xunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pack
        working-directory: adapters/xunit
        run: |
          dotnet pack -c Release -p:PackageVersion=${{ inputs.version }} -o ../../dist/nuget
          ls -la ../../dist/nuget
      - name: Push to GitHub Packages
        if: ${{ inputs.dry_run == false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push dist/nuget/*.nupkg \
            --api-key "$GITHUB_TOKEN" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate
      - uses: actions/upload-artifact@v4
        with:
          name: xunit-nuget
          path: dist/nuget/*
          if-no-files-found: error

  release:
    needs: [junit5, jest, xunit]
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-adapters
      - name: Make GitHub Packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Best-effort: public package pages + inherit public-repo visibility.
          # GitHub Packages still requires a PAT with read:packages to *download*.
          for spec in \
            "maven/io.github.vaquarkhan.mcp-test-suite-junit5" \
            "npm/mcp-test-suite-jest" \
            "nuget/McpTestSuite.Xunit"
          do
            type="${spec%%/*}"
            name="${spec#*/}"
            echo "Setting visibility public for $type/$name"
            gh api --method PUT \
              "/user/packages/${type}/${name}/visibility" \
              -f visibility=public \
              || gh api --method PUT \
              "/orgs/${{ github.repository_owner }}/packages/${type}/${name}/visibility" \
              -f visibility=public \
              || echo "::warning::Could not set visibility for $type/$name (may already be public or API unsupported)"
          done
      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          find dist-adapters -type f | sort
          NOTES="$(mktemp)"
          cat > "$NOTES" <<EOF
          ## MCP Test Suite adapters ${{ inputs.version }}

          **Engine (PyPI):** \`pip install mcp-test-harness\`

          ### Package pages (GitHub Packages)
          - **Maven:** https://github.com/${{ github.repository }}/packages?runtime=maven
          - **npm:** https://github.com/users/${{ github.repository_owner }}/packages/npm/package/mcp-test-suite-jest
          - **NuGet:** https://github.com/users/${{ github.repository_owner }}/packages/nuget/package/McpTestSuite.Xunit

          Download assets below (JAR / npm tarball / NuGet), or install from GitHub Packages — see [DOWNLOADS.md](https://github.com/${{ github.repository }}/blob/init/docs/DOWNLOADS.md).

          **Go:** \`go get github.com/${{ github.repository }}/adapters/gotest@v${{ inputs.version }}\`
          EOF
          mapfile -t FILES < <(find dist-adapters -type f \( -name '*.jar' -o -name '*.tgz' -o -name '*.nupkg' -o -name '*.snupkg' -o -name 'pom.xml' \))
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "Adapters ${{ inputs.version }}" \
              --notes-file "$NOTES"
          fi