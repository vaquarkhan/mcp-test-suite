# Connector tests + e2e every PR. Engine self-tests live in mcp-test-harness.
name: validate

on:
  push:
    branches: [main, master, init]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectors:
    name: Suite connectors + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install suite (pulls mcp-test-harness from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify engine + suite imports
        run: python scripts/verify_upstream.py
      - name: Unit + e2e + coverage
        run: |
          coverage run -m pytest tests/ -q
          coverage report --fail-under=80
      - name: CLI smoke
        run: |
          mcp-suite --version
          mcp-suite run --suite tests/e2e/mcp-suite.e2e.yaml --list

  dist-smoke:
    name: Distribution smoke (Docker + Action)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Docker image --version (local build; installs harness from PyPI)
        run: |
          docker build -t mcp-test-suite:ci .
          docker run --rm mcp-test-suite:ci --version

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Fixture server dependency (FastMCP)
        run: python -m pip install "mcp>=1.2.0"

      - name: GitHub Action composite (try-mode against fixture)
        uses: ./.github/actions/mcp-test
        with:
          try-mode: "true"
          server-command: "python ${{ github.workspace }}/tests/fixtures/minimal_mcp_server.py"
          harness-version: "3.0.9"
