<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">MCP Test Suite architecture</title>
  <desc id="desc">Language adapters and mcp-suite.yaml depend on mcp-test-harness from PyPI; the suite does not vendor the engine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1400" height="520" rx="20" fill="url(#bg)"/>
  <text x="700" y="48" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">
    mcp-test-suite = connectors · mcp-test-harness = engine (PyPI)
  </text>

  <!-- Adapters row -->
  <rect x="40" y="90" width="1320" height="100" rx="14" fill="#0b1220" stroke="#334155"/>
  <text x="60" y="125" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="14">Native adapters (this repo)</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#e2e8f0">
    <rect x="60" y="140" width="140" height="36" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="130" y="163" text-anchor="middle">Jest / Node</text>
    <rect x="220" y="140" width="140" height="36" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="290" y="163" text-anchor="middle">JUnit 5</text>
    <rect x="380" y="140" width="140" height="36" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="450" y="163" text-anchor="middle">Go test</text>
    <rect x="540" y="140" width="140" height="36" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="610" y="163" text-anchor="middle">xUnit</text>
    <rect x="700" y="140" width="160" height="36" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="780" y="163" text-anchor="middle">Python / Rust</text>
    <rect x="880" y="140" width="220" height="36" rx="8" fill="#1e293b" stroke="#a78bfa"/>
    <text x="990" y="163" text-anchor="middle">mcp-suite.yaml</text>
    <rect x="1120" y="140" width="220" height="36" rx="8" fill="#1e293b" stroke="#34d399"/>
    <text x="1230" y="163" text-anchor="middle">GitHub Action</text>
  </g>

  <line x1="700" y1="190" x2="700" y2="240" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Suite connector -->
  <rect x="420" y="250" width="560" height="80" rx="14" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
  <text x="700" y="285" text-anchor="middle" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">mcp-suite CLI + declarative plugin</text>
  <text x="700" y="312" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI, Arial, sans-serif" font-size="14">this repo · no engine source vendored</text>

  <line x1="700" y1="330" x2="700" y2="380" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PyPI engine -->
  <rect x="360" y="390" width="680" height="90" rx="14" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="700" y="428" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">mcp-test-harness (PyPI)</text>
  <text x="700" y="456" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="14">
    pip install mcp-test-harness · updates flow when you upgrade the package
  </text>
</svg>
