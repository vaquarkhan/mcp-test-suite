<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Suite e2e dogfood</title>
  <desc id="desc">CI e2e invokes mcp-suite against a minimal stdio MCP server fixture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#86efac"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="16" fill="url(#bg)"/>
  <text x="600" y="42" text-anchor="middle" fill="#f0fdf4" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">
    End-to-end: catch connector breakage early
  </text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="100" width="200" height="70" rx="12" fill="#052e16" stroke="#4ade80"/>
    <text x="160" y="142" text-anchor="middle" fill="#dcfce7" font-size="15">tests/e2e CI</text>

    <line x1="260" y1="135" x2="330" y2="135" stroke="#86efac" stroke-width="2" marker-end="url(#a)"/>

    <rect x="330" y="100" width="220" height="70" rx="12" fill="#052e16" stroke="#4ade80"/>
    <text x="440" y="142" text-anchor="middle" fill="#dcfce7" font-size="15">mcp-suite run</text>

    <line x1="550" y1="135" x2="620" y2="135" stroke="#86efac" stroke-width="2" marker-end="url(#a)"/>

    <rect x="620" y="100" width="260" height="70" rx="12" fill="#052e16" stroke="#4ade80"/>
    <text x="750" y="142" text-anchor="middle" fill="#dcfce7" font-size="15">minimal MCP fixture</text>

    <line x1="880" y1="135" x2="950" y2="135" stroke="#86efac" stroke-width="2" marker-end="url(#a)"/>

    <rect x="950" y="100" width="190" height="70" rx="12" fill="#14532d" stroke="#86efac"/>
    <text x="1045" y="142" text-anchor="middle" fill="#dcfce7" font-size="15">pass / fail</text>
  </g>

  <text x="600" y="240" text-anchor="middle" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Also validates every examples/frameworks/*/mcp-suite.yaml
  </text>
  <text x="600" y="280" text-anchor="middle" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14">
    Engine self-tests stay in mcp-test-harness on PyPI — not duplicated here
  </text>
</svg>
