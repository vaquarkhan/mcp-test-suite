<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">MCP Test Suite hero banner</title>
  <desc id="desc">Multi-language MCP testing: PyPI engine, declarative YAML, native adapters, Docker and CI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1340" cy="80" r="210" fill="#22d3ee" opacity="0.08"/>
  <circle cx="150" cy="420" r="180" fill="#34d399" opacity="0.10"/>

  <g transform="translate(86 74)">
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#0b1220" stroke="#334155"/>
    <text x="20" y="23" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#67e8f9">Engine from PyPI · connectors here</text>

    <text x="0" y="94" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="62" fill="#f8fafc">MCP Test Suite</text>
    <text x="0" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#cbd5e1">
      Multi-language testing for MCP servers
    </text>
    <text x="0" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94a3b8">
      One mcp-suite.yaml · Jest · JUnit · Go · .NET · Docker · CI
    </text>

    <g transform="translate(0 246)" font-family="Segoe UI, Arial, sans-serif">
      <rect x="0" y="0" width="260" height="72" rx="16" fill="#0b1220" stroke="#1e293b"/>
      <text x="22" y="30" font-family="Consolas, Menlo, monospace" font-size="18" fill="#e2e8f0">mcp-suite.yaml</text>
      <text x="22" y="54" font-size="15" fill="#94a3b8">Shared contract</text>

      <rect x="280" y="0" width="260" height="72" rx="16" fill="#0b1220" stroke="#1e293b"/>
      <text x="302" y="30" font-family="Consolas, Menlo, monospace" font-size="18" fill="#e2e8f0">mcp-test-harness</text>
      <text x="302" y="54" font-size="15" fill="#94a3b8">PyPI engine (not vendored)</text>

      <rect x="560" y="0" width="260" height="72" rx="16" fill="#0b1220" stroke="#1e293b"/>
      <text x="582" y="30" font-size="18" fill="#e2e8f0">Native adapters</text>
      <text x="582" y="54" font-size="15" fill="#94a3b8">Node · Java · Go · .NET</text>
    </g>
  </g>
</svg>
