[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-test-suite"
version = "4.0.0"
description = "MCP Test Suite — multi-language adapters and declarative YAML on top of the PyPI mcp-test-harness engine (connectors only; engine is not vendored here)."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Vaquar Khan", email = "vaquarkhan@gmail.com"}]
keywords = ["mcp", "mcp-test-suite", "mcp-test", "testing", "model-context-protocol", "test-harness", "json-rpc", "jest", "junit", "golang"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  # Pin major to limit breakage from harness private APIs used by mcp-suite run.
  "mcp-test-harness>=3.0.9,<4",
  # Harness 3.0.9 declares mcp>=1.0.0 but its stdio client breaks on mcp 2.0
  # (JSONRPCMessage UnionType). Cap here until the engine supports mcp 2.x.
  "mcp>=1.2,<2",
  "pyyaml>=6.0",
  "jsonschema>=4.0.0",
]

[project.scripts]
# Suite CLI wraps the PyPI engine and adds ``run`` for declarative YAML.
# Does not replace the engine's ``mcp-test`` entry point.
mcp-suite = "mcp_test_suite.cli:main"

[project.entry-points."mcp_test_harness"]
declarative = "mcp_test_suite.plugin"

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "coverage>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/vaquarkhan/mcp-test-suite"
Repository = "https://github.com/vaquarkhan/mcp-test-suite"
Documentation = "https://github.com/vaquarkhan/mcp-test-suite#readme"
Changelog = "https://github.com/vaquarkhan/mcp-test-suite/blob/main/CHANGELOG.md"
Docker = "https://github.com/vaquarkhan/mcp-test-suite/blob/main/docs/DOCKER.md"
MultiLanguage = "https://github.com/vaquarkhan/mcp-test-suite/blob/main/docs/MULTI_LANGUAGE.md"
CursorIDE = "https://github.com/vaquarkhan/mcp-test-suite/blob/main/docs/CURSOR_IDE.md"
Engine = "https://github.com/vaquarkhan/mcp-test-harness"
PyPIEngine = "https://pypi.org/project/mcp-test-harness/"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_test_suite"]

[tool.hatch.build.targets.sdist]
include = [
  "src/mcp_test_suite",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "NOTICE",
  "CITATION.cff",
  "docs",
  "adapters",
  "examples",
  "action.yml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
  "e2e: end-to-end dogfood tests (subprocess mcp-test CLI against real MCP server)",
]

[tool.coverage.run]
source = ["src/mcp_test_suite"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "^\\s+\\.\\.\\.$",
]
